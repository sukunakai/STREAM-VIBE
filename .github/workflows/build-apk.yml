name: Build Android APKs via Gradle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Generate User App APK
      run: |
        mkdir -p user-apk-build
        cd user-apk-build
        bubblewrap init --manifest=https://sukunakai.github.io/STREAM-VIBE/user/manifest.json --directory=. || true
        bubblewrap build || true

    - name: Upload User APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StreamVibe-User-APK
        path: |
          user-apk-build/*.apk
          user-apk-build/app/build/outputs/apk/debug/*.apk

    - name: Generate Admin Panel APK
      run: |
        mkdir -p admin-apk-build
        cd admin-apk-build
        bubblewrap init --manifest=https://sukunakai.github.io/STREAM-VIBE/admin/manifest.json --directory=. || true
        bubblewrap build || true

    - name: Upload Admin APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StreamVibe-Admin-APK
        path: |
          admin-apk-build/*.apk
          admin-apk-build/app/build/outputs/apk/debug/*.apk

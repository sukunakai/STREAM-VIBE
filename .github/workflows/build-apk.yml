name: Build StreamVibe Android Packages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install PWABuilder CLI
      run: npm install -g @pwabuilder/cli

    - name: Generate User App Android Package
      run: |
        mkdir -p user-package
        pwabuilder package --manifest https://sukunakai.github.io/STREAM-VIBE/user/manifest.json --platforms android --directory ./user-package || true

    - name: Generate Admin Panel Android Package
      run: |
        mkdir -p admin-package
        pwabuilder package --manifest https://sukunakai.github.io/STREAM-VIBE/admin/manifest.json --platforms android --directory ./admin-package || true

    - name: Upload User Android Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StreamVibe-User-Android-Source
        path: user-package/

    - name: Upload Admin Android Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StreamVibe-Admin-Android-Source
        path: admin-package/

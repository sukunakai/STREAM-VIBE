name: Build StreamVibe APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Prepare App Source Folders
      run: |
        mkdir -p user-dist admin-dist
        cp -r user/* user-dist/
        cp -r admin/* admin-dist/

    - name: Upload User App Source Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StreamVibe-User-App-Files
        path: user-dist/

    - name: Upload Admin Panel Source Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StreamVibe-Admin-Panel-Files
        path: admin-dist/

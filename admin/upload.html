<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Content - StreamVibe</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; }
        .form-container { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #e50914; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="form-container">
        <h2>Upload Movie / Series</h2>
        <form id="uploadForm">
            <label>Title:</label>
            <input type="text" id="title" placeholder="Movie Name" required>
            <label>Category:</label>
            <select id="category">
                <option value="Movie">Movie</option>
                <option value="Anime">Anime</option>
                <option value="Series">TV Series</option>
            </select>
            <label>Poster Image URL:</label>
            <input type="url" id="poster" placeholder="Image link (URL)" required>
            <label>Video Streaming URL:</label>
            <input type="url" id="videoUrl" placeholder="MP4 / HLS Link" required>
            <button type="submit">Upload Now</button>
        </form>
    </div>

    <script>
        // Database Connection
        const supabaseUrl = 'https://jjpzecchomlrjtmvshvn.supabase.co';
        const supabaseKey = 'sb_publishable_0E5zGq8-reKSdg8hjaw5SA__LsyIBIm';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const poster_url = document.getElementById('poster').value;
            const video_url = document.getElementById('videoUrl').value;

            // Database mein data bhej rahe hain
            const { data, error } = await supabase
                .from('movies')
                .insert([{ title: title, category: category, poster_url: poster_url, video_url: video_url }]);

            if (error) {
                alert('Upload Failed: ' + error.message);
            } else {
                alert('Movie Uploaded Successfully! 🎉');
                document.getElementById('uploadForm').reset(); // Form clear karna
            }
        });
    </script>
</body>
</html>

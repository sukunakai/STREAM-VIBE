<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #121212; color: #fff; font-family: Arial; padding: 20px; }
        .box { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #e50914; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Admin Upload</h2>
        <form id="form">
            <input type="text" id="t" placeholder="Title" required>
            <select id="c">
                <option value="Movie">Movie</option>
                <option value="Anime">Anime</option>
            </select>
            <input type="url" id="p" placeholder="Poster URL" required>
            <input type="url" id="v" placeholder="Video URL" required>
            <button type="submit">Upload Now</button>
        </form>
    </div>

    <script>
        const sb = window.supabase.createClient(
            'https://jjpzecchomlrjtmvshvn.supabase.co',
            'sb_publishable_0E5zGq8-reKSdg8hjaw5SA__LsyIBIm'
        );

        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            alert('Button dab gaya, data bhej rahe hain...');

            const { data, error } = await sb.from('movies').insert([
                {
                    title: document.getElementById('t').value,
                    category: document.getElementById('c').value,
                    poster_url: document.getElementById('p').value,
                    video_url: document.getElementById('v').value
                }
            ]);

            if (error) {
                alert('Database Error: ' + error.message);
            } else {
                alert('Success! Movie database mein chali gayi.');
                document.getElementById('form').reset();
            }
        };
    </script>
</body>
</html>

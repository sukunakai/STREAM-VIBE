<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe Admin - Phone Upload</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #121212; color: #fff; font-family: Arial; padding: 20px; }
        .box { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; box-sizing: border-box; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #e50914; color: #fff; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }
        label { font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Upload Movie from Phone</h2>
        <form id="form">
            <label>Movie Title:</label>
            <input type="text" id="t" placeholder="Movie Name" required>
            
            <label>Category:</label>
            <select id="c">
                <option value="Movie">Movie</option>
                <option value="Anime">Anime</option>
                <option value="Series">TV Series</option>
            </select>
            
            <label>Select Poster Image (from Phone):</label>
            <input type="file" id="posterFile" accept="image/*" required>
            
            <label>Select Video File (from Phone):</label>
            <input type="file" id="videoFile" accept="video/*" required>
            
            <button type="submit" id="subBtn">Upload to Cloud</button>
        </form>
    </div>

    <script>
        const sb = window.supabase.createClient(
            'https://jjpzecchomlrjtmvshvn.supabase.co',
            'sb_publishable_0E5zGq8-reKSdg8hjaw5SA__LsyIBIm'
        );

        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            btn.innerText = 'Uploading files... Please wait';
            btn.disabled = true;

            try {
                const title = document.getElementById('t').value;
                const category = document.getElementById('c').value;
                const posterFile = document.getElementById('posterFile').files[0];
                const videoFile = document.getElementById('videoFile').files[0];

                const time = Date.now();
                const posterName = `${time}_${posterFile.name}`;
                const videoName = `${time}_${videoFile.name}`;

                // 1. Upload Poster to Supabase 'media' bucket
                const { error: posterError } = await sb.storage
                    .from('media')
                    .upload(posterName, posterFile);
                if (posterError) throw posterError;

                // 2. Upload Video to Supabase 'media' bucket
                const { error: videoError } = await sb.storage
                    .from('media')
                    .upload(videoName, videoFile);
                if (videoError) throw videoError;

                // 3. Get Public URLs
                const { data: posterUrlData } = sb.storage.from('media').getPublicUrl(posterName);
                const { data: videoUrlData } = sb.storage.from('media').getPublicUrl(videoName);

                // 4. Save entry in movies table
                const { error: dbError } = await sb.from('movies').insert([
                    {
                        title: title,
                        category: category,
                        poster_url: posterUrlData.publicUrl,
                        video_url: videoUrlData.publicUrl
                    }
                ]);

                if (dbError) throw dbError;

                alert('Success! Movie phone se upload ho gayi hai. 🎉');
                document.getElementById('form').reset();
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.innerText = 'Upload to Cloud';
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>

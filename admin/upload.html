<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Content - StreamVibe</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; }
        .form-container { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #e50914; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #statusMsg { margin-top: 15px; padding: 10px; border-radius: 4px; text-align: center; font-weight: bold; display: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="form-container">
        <h2>Upload Movie / Series</h2>
        <form id="uploadForm">
            <label>Title:</label>
            <input type="text" id="title" placeholder="Movie Name" required>
            <label>Category:</label>
            <select id="category">
                <option value="Movie">Movie</option>
                <option value="Anime">Anime</option>
                <option value="Series">TV Series</option>
            </select>
            <label>Poster Image URL:</label>
            <input type="url" id="poster" placeholder="Image link (URL)" required>
            <label>Video Streaming URL:</label>
            <input type="url" id="videoUrl" placeholder="MP4 / HLS Link" required>
            <button type="submit" id="submitBtn">Upload Now</button>
        </form>
        <div id="statusMsg"></div>
    </div>

    <script>
        const supabaseUrl = 'https://jjpzecchomlrjtmvshvn.supabase.co';
        const supabaseKey = 'sb_publishable_0E5zGq8-reKSdg8hjaw5SA__LsyIBIm';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('statusMsg');
            btn.innerText = 'Uploading...';
            msg.style.display = 'none';

            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const poster_url = document.getElementById('poster').value;
            const video_url = document.getElementById('videoUrl').value;

            try {
                const { data, error } = await supabase
                    .from('movies')
                    .insert([{ title, category, poster_url, video_url }]);

                if (error) {
                    throw error;
                }

                msg.style.display = 'block';
                msg.style.background = '#28a745';
                msg.style.color = 'white';
                msg.innerText = 'Movie Uploaded Successfully! 🎉';
                document.getElementById('uploadForm').reset();
            } catch (err) {
                msg.style.display = 'block';
                msg.style.background = '#dc3545';
                msg.style.color = 'white';
                msg.innerText = 'Failed: ' + err.message;
            } finally {
                btn.innerText = 'Upload Now';
            }
        });
    </script>
</body>
</html>
